# Packages the staged app (apps/desktop/release-app, created by scripts/stage.mjs).
appId: dev.multi-ai-coder.desktop
productName: Multi-AI Coder
copyright: Copyright © 2026 Multi-AI Coder
electronVersion: 44.5.1
directories:
  app: release-app
  output: release
  buildResources: build
# The Prisma query engine and node-pty ship native .node binaries and the runtime is started as a
# utility process from a plain file path, so the app is packaged without an asar archive.
asar: false
npmRebuild: false
nodeGypRebuild: false
files:
  - '**/*'
# electron-builder always drops dot-directories inside node_modules; the generated Prisma client
# (with the query engine) lives in node_modules/.prisma, so it is copied explicitly.
extraResources:
  # TypeScript's standard-library declarations are runtime inputs to the language server.
  # The default file matcher drops .d.ts; copy this complete runtime directory explicitly.
  - from: release-app/backend/typescript
    to: app/backend/typescript
    filter: ['**/*']
  - from: release-app/node_modules/.prisma
    to: app/node_modules/.prisma
    filter: ['**/*']
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Multi-AI Coder
  runAfterFinish: true
  # the uninstaller asks instead (build/installer.nsh, customUnInstall)
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  installerLanguages: [de_DE]
  language: '1031'
# Native modules (Prisma engine, node-pty) are staged for the build machine's architecture only, so
# each architecture is built on its own Mac: `--mac --arm64` on Apple Silicon, `--mac --x64` on Intel
# (see .github/workflows/desktop-release.yml). Signing + notarization run when CSC_LINK and
# APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set; otherwise the app is ad-hoc signed.
mac:
  target:
    - target: dmg
    - target: zip
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Multi-AI Coder opens and edits the projects you choose.
    NSDesktopFolderUsageDescription: Multi-AI Coder opens and edits the projects you choose.
    NSDownloadsFolderUsageDescription: Multi-AI Coder opens and edits the projects you choose.
# DMG window: background (build/background.png + @2x) is drawn for these icon positions.
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  title: ${productName} ${version}
  background: build/background.png
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 196
      type: file
    - x: 400
      y: 196
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
